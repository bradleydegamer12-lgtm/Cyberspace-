<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CyberForge — Professional Websites For Modern Businesses</title>
<meta name="description" content="CyberForge creates fast, modern and high-converting websites for businesses.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23111'/%3E%3Cpath d='M22 10a9 9 0 1 0 0 12' stroke='white' stroke-width='2.5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#FAFAFA;--sf:#FFF;--alt:#F4F4F4;--tx:#111;--t2:#555;--t3:#999;--ac:#111;--abg:#F0F0F0;--gn:#22C55E;--rd:#EF4444;--yw:#F59E0B;--bd:#E5E5E5;--bd2:#F0F0F0;--fd:'DM Serif Display',serif;--fb:'Plus Jakarta Sans',sans-serif;--r:16px;--rs:10px;--rp:100px;--sh:0 2px 8px rgba(0,0,0,.06),0 0 1px rgba(0,0,0,.08);--shl:0 8px 30px rgba(0,0,0,.08);--shx:0 20px 60px rgba(0,0,0,.1);--tr:.3s cubic-bezier(.4,0,.2,1)}
html{scroll-behavior:smooth;scrollbar-width:thin;scrollbar-color:var(--bd) var(--bg)}
body{font-family:var(--fb);background:var(--bg);color:var(--tx);line-height:1.6;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:9998;opacity:.015;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--bd);border-radius:3px}
a{color:var(--tx);text-decoration:none;transition:var(--tr)}a:hover{opacity:.7}
button{font-family:var(--fb);cursor:pointer;border:none;outline:none;background:none;color:inherit}
input,textarea,select{font-family:var(--fb)}
h1,h2,h3,h4{font-weight:700;line-height:1.15}
::selection{background:#ddd;color:#000}:focus-visible{outline:2px solid var(--tx);outline-offset:2px;border-radius:4px}

/* Loader */
#ld{position:fixed;inset:0;z-index:9999;background:#fff;display:flex;align-items:center;justify-content:center;transition:opacity .5s,visibility .5s}#ld.hide{opacity:0;visibility:hidden}
@keyframes lspin{to{transform:rotate(360deg)}}#ld svg{animation:lspin 2s linear infinite}

/* Navigation */
.nav{position:fixed;top:0;left:0;right:0;z-index:1000;height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(20px,4vw,60px);background:rgba(255,255,255,.85);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);transition:var(--tr)}.nav.sc{box-shadow:var(--sh);background:rgba(255,255,255,.95)}
.nl{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px;color:var(--tx);letter-spacing:-.01em;cursor:pointer}.nl svg{flex-shrink:0}
.nk{display:flex;gap:6px;align-items:center}.nk a{color:var(--t2);font-size:14px;font-weight:500;padding:8px 14px;border-radius:var(--rp);transition:var(--tr)}.nk a:hover{color:var(--tx);background:var(--bd2)}.nk a.on{color:var(--tx);background:var(--abg)}
.nc{background:var(--tx)!important;color:#fff!important;font-weight:600!important}.nc:hover{background:#333!important;opacity:1!important;transform:translateY(-1px);box-shadow:0 4px 16px rgba(0,0,0,.15)}
.mb{display:none;padding:8px}
.mm{position:fixed;inset:0;z-index:999;background:rgba(255,255,255,.98);backdrop-filter:blur(20px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;opacity:0;pointer-events:none;transition:var(--tr)}.mm.open{opacity:1;pointer-events:all}
.mm a{font-size:22px;font-weight:600;color:var(--tx);padding:12px 24px;border-radius:var(--r)}.mm a:hover{background:var(--abg)}
.mmx{position:absolute;top:20px;right:24px;padding:8px}
@media(max-width:900px){.nk{display:none}.mb{display:block}}

/* Sections */
.sec{padding:clamp(60px,10vw,120px) clamp(20px,4vw,60px)}.ct{max-width:1200px;margin:0 auto;width:100%}
.sh{margin-bottom:clamp(40px,6vw,72px)}.sh.c{text-align:center}
.sl{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--t2);background:var(--abg);padding:5px 14px;border-radius:var(--rp);margin-bottom:16px;text-transform:uppercase}
.st{font-size:clamp(28px,4.5vw,52px);margin-bottom:16px;color:var(--tx);letter-spacing:-.02em}.sd{color:var(--t2);font-size:clamp(15px,1.6vw,18px);max-width:560px;line-height:1.7}.sh.c .sd{margin:0 auto}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;border-radius:var(--rp);font-weight:600;font-size:14px;transition:var(--tr);white-space:nowrap}
.bp{background:var(--tx);color:#fff}.bp:hover{background:#333;transform:translateY(-1px);box-shadow:0 4px 16px rgba(0,0,0,.15);opacity:1}
.bs{background:transparent;color:var(--tx);border:1.5px solid var(--tx)}.bs:hover{background:var(--abg);opacity:1}
.bg{background:transparent;color:var(--t2)}.bg:hover{color:var(--tx);background:var(--bd2);opacity:1}
.bl{padding:14px 32px;font-size:15px}.bm{padding:8px 16px;font-size:12px}.bd{opacity:.5;pointer-events:none}

/* Cards */
.cd{background:var(--sf);border-radius:var(--r);box-shadow:var(--sh);transition:var(--tr)}.cd:hover{box-shadow:var(--shl);transform:translateY(-4px)}

/* Inputs */
.in{width:100%;padding:12px 16px;background:var(--sf);border:1.5px solid var(--bd);border-radius:var(--rs);font-size:14px;color:var(--tx);transition:var(--tr)}.in:focus{border-color:var(--tx);outline:none;box-shadow:0 0 0 3px var(--abg)}.in::placeholder{color:var(--t3)}.in.err{border-color:var(--rd)}
.sel{width:100%;padding:12px 16px;background:var(--sf);border:1.5px solid var(--bd);border-radius:var(--rs);font-size:14px;color:var(--tx);-webkit-appearance:none;cursor:pointer}.sel:focus{border-color:var(--tx);outline:none}
.tat{width:100%;min-height:80px;padding:12px 16px;background:var(--sf);border:1.5px solid var(--bd);border-radius:var(--rs);font-size:14px;color:var(--tx);resize:vertical}.tat:focus{border-color:var(--tx);outline:none}.tat.err{border-color:var(--rd)}
.err-msg{font-size:12px;color:var(--rd);margin-top:4px;font-weight:500}

/* Tags & Badges */
.tags{display:flex;flex-wrap:wrap;gap:6px}.tag{padding:4px 12px;background:var(--abg);border-radius:var(--rp);font-size:11px;font-weight:600;color:var(--t2)}
.sb{display:inline-block;padding:3px 10px;border-radius:var(--rp);font-size:11px;font-weight:600}.sb.active{background:#ECFDF5;color:#059669}.sb.pending{background:#FEF3C7;color:#D97706}.sb.completed{background:var(--abg);color:var(--t2)}.sb.approved{background:#ECFDF5;color:#059669}.sb.paid{background:#ECFDF5;color:#059669}.sb.open{background:#FEF3C7;color:#D97706}.sb.resolved{background:#ECFDF5;color:#059669}

/* Animations */
@keyframes fu{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.rev{opacity:0;transform:translateY(20px);transition:opacity .6s ease,transform .6s ease}.rev.v{opacity:1;transform:translateY(0)}
@media(prefers-reduced-motion:reduce){.rev{opacity:1!important;transform:none!important;transition:none!important}}

/* Image Placeholders */
.img-ph{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.img-ph-label{position:absolute;bottom:8px;left:8px;font-size:9px;font-weight:700;letter-spacing:.06em;color:rgba(255,255,255,.45);text-transform:uppercase}
.img-ph-icon{opacity:.15}

/* Hero */
.hero{padding:140px clamp(20px,4vw,60px) 80px;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:-200px;right:-200px;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(0,0,0,.03),transparent 70%);pointer-events:none}
.hg{display:grid;grid-template-columns:1fr 1fr;gap:clamp(40px,6vw,80px);align-items:center}
.hb{display:inline-flex;align-items:center;gap:8px;padding:6px 16px;background:var(--abg);border-radius:var(--rp);font-size:12px;font-weight:600;color:var(--t2);margin-bottom:24px}
.hbd{width:6px;height:6px;border-radius:50%;background:var(--gn)}
.hero h1{font-family:var(--fd);font-size:clamp(36px,5.5vw,68px);line-height:1.08;margin-bottom:24px;letter-spacing:-.02em}
.hero h1 em{font-style:normal;background:linear-gradient(135deg,#111,#666);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hd{font-size:clamp(15px,1.5vw,18px);color:var(--t2);margin-bottom:32px;max-width:480px;line-height:1.7}
.hbtn{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:40px}
.hfts{display:flex;gap:32px}.hft b{display:block;font-size:clamp(16px,1.5vw,18px);font-weight:800;letter-spacing:-.01em}.hft span{font-size:13px;color:var(--t3);font-weight:500}
@media(max-width:900px){.hg{grid-template-columns:1fr;text-align:center}.hero{padding-top:110px}.hd{margin:0 auto 32px}.hbtn{justify-content:center}.hfts{justify-content:center}}

/* Mock Browser */
.mock{position:relative;background:var(--sf);border-radius:var(--r);box-shadow:var(--shx);overflow:hidden;border:1px solid var(--bd)}
.mock-bar{display:flex;align-items:center;gap:8px;padding:10px 16px;background:#fafafa;border-bottom:1px solid var(--bd)}
.mock-dot{width:10px;height:10px;border-radius:50%}.mock-url{flex:1;margin-left:8px;padding:4px 12px;background:var(--bg);border-radius:6px;font-size:11px;color:var(--t3)}
.mock-body{overflow:hidden}
@media(max-width:900px){.mock{max-width:480px;margin:0 auto}}

/* Trust Bar */
.trust-bar{display:flex;align-items:center;justify-content:center;gap:clamp(24px,4vw,48px);flex-wrap:wrap;padding:24px}.trust-l{font-size:clamp(14px,1.5vw,18px);font-weight:700;color:var(--t3);opacity:.45;letter-spacing:-.01em}

/* Services */
.svc-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}.svc-c{padding:28px;border-radius:var(--r);background:var(--sf);border:1.5px solid var(--bd2);transition:var(--tr)}.svc-c:hover{border-color:var(--bd);transform:translateY(-4px);box-shadow:var(--shl)}
.si{width:48px;height:48px;border-radius:var(--rs);display:flex;align-items:center;justify-content:center;margin-bottom:16px;transition:var(--tr)}.svc-c:hover .si{transform:scale(1.05)}
.svc-c h3{font-size:16px;font-weight:700;margin-bottom:8px}.svc-c p{color:var(--t2);font-size:14px;margin-bottom:16px;line-height:1.6}

/* Portfolio */
.pf-f{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:32px;justify-content:center}.pf-b{padding:8px 18px;border-radius:var(--rp);font-size:13px;font-weight:600;color:var(--t2);background:var(--bd2);transition:var(--tr)}.pf-b:hover{color:var(--tx);background:var(--bd)}.pf-b.on{color:#fff;background:var(--tx)}
.pf-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.pf-i{border-radius:var(--r);overflow:hidden;background:var(--sf);box-shadow:var(--sh);transition:var(--tr);cursor:pointer}.pf-i:hover{transform:translateY(-6px);box-shadow:var(--shx)}
.pf-i2{padding:16px 20px}.pf-i2 h4{font-size:15px;font-weight:700;margin-bottom:4px}.pf-i2 p{font-size:13px;color:var(--t2);margin-bottom:8px}.pf-t{display:flex;gap:6px}
.pf-m{aspect-ratio:16/10;overflow:hidden;position:relative;background:#f8f8f8}
.pf-mc{position:absolute;inset:0;display:flex;flex-direction:column}

/* Visual preview mini */
.vs-nav{display:flex;align-items:center;gap:6px;padding:5px 8px;border-bottom:1px solid rgba(0,0,0,.06);background:rgba(255,255,255,.9)}
.vs-nl{width:24px;height:4px;background:var(--tx);border-radius:2px;opacity:.8}
.vs-nks{display:flex;gap:4px;margin-left:auto}
.vs-nk{width:14px;height:3px;background:#ddd;border-radius:1px}
.vs-card{border-radius:4px;overflow:hidden;background:var(--sf);border:1px solid rgba(0,0,0,.04)}
.vs-card-body{padding:4px 5px}
.vs-card-t{height:3px;background:rgba(0,0,0,.12);border-radius:1px;margin-bottom:3px}
.vs-card-p{height:2px;background:rgba(0,0,0,.06);border-radius:1px}
.vs-foot{display:flex;gap:4px;padding:4px 5px}
.vs-ft{height:2px;background:rgba(0,0,0,.05);border-radius:1px;width:20px}

/* Full visual preview */
.vs-full{background:var(--sf)}
.vs-full-nav{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--bd2)}
.vs-full-logo{font-weight:800;font-size:13px}
.vs-full-nks{display:flex;gap:12px}
.vs-full-nk{font-size:11px;color:var(--t2)}
.vs-full-hero{padding:40px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.vs-full-hero h2{font-size:clamp(16px,2.5vw,22px);font-family:var(--fd)}
.vs-full-hero p{font-size:12px}
.vs-full-section{padding:20px 16px}
.vs-full-section h3{font-size:14px;font-weight:700;margin-bottom:12px}
.vs-full-grid{display:grid;gap:10px}
.vs-full-card{background:var(--sf);border-radius:var(--rs);overflow:hidden;border:1px solid var(--bd2)}
.vs-full-card-img{overflow:hidden}
.vs-full-card-body{padding:8px 10px}
.vs-full-card-t{font-size:12px;font-weight:700;margin-bottom:2px}
.vs-full-card-p{font-size:10px;color:var(--t3);margin-bottom:2px}
.vs-full-card-pr{font-size:12px;font-weight:800}
.vs-full-gallery{display:grid;gap:8px}
.vs-full-cta{background:var(--tx);color:#fff;padding:32px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.vs-full-cta h3{font-size:16px;color:#fff}
.vs-full-cta p{font-size:12px;color:rgba(255,255,255,.6)}
.vs-full-foot{padding:12px 16px;text-align:center;font-size:10px;color:var(--t3);border-top:1px solid var(--bd2)}

/* Portfolio preview overlay */
.pv{position:fixed;inset:0;z-index:999;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:20px}
.pv-card{background:var(--sf);border-radius:var(--r);width:100%;max-width:900px;max-height:90vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shx)}
.pv-hd{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--bd)}
.pv-ctrls{display:flex;gap:4px}
.pv-btn{padding:6px 14px;border-radius:var(--rp);font-size:12px;font-weight:600;color:var(--t2);background:var(--bd2);transition:var(--tr)}.pv-btn.on{background:var(--tx);color:#fff}
.pv-close{padding:6px;color:var(--t3)}
.pv-body{flex:1;overflow-y:auto;padding:16px;background:var(--alt)}
.pv-frame{background:var(--sf);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh)}
.pv-cta{padding:12px 16px;border-top:1px solid var(--bd);text-align:center}

/* Process */
.proc{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:20px}
.proc-c{padding:24px;border-radius:var(--r);background:var(--sf);border:1.5px solid var(--bd2);transition:var(--tr)}.proc-c:hover{border-color:var(--bd);transform:translateY(-4px);box-shadow:var(--shl)}
.proc-n{font-size:11px;font-weight:800;color:var(--t3);letter-spacing:.04em;margin-bottom:8px}
.proc-c h3{font-size:15px;font-weight:700;margin-bottom:6px}
.proc-c p{font-size:13px;color:var(--t2);line-height:1.6}

/* Forge */
.ft{background:var(--sf);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.ft-tabs{display:flex;border-bottom:1px solid var(--bd2);overflow-x:auto}
.ft-tab{flex:1;min-width:0;padding:14px 12px;text-align:center;font-size:12px;font-weight:700;color:var(--t3);cursor:pointer;transition:var(--tr);white-space:nowrap}.ft-tab.on{color:var(--tx);border-bottom:2px solid var(--tx)}
.ft-step{padding:clamp(20px,3vw,32px)}
.ft-opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ft-opt{padding:12px 16px;border-radius:var(--rs);border:1.5px solid var(--bd2);font-size:13px;font-weight:600;text-align:center;cursor:pointer;transition:var(--tr)}.ft-opt:hover{border-color:var(--bd)}.ft-opt.sel{border-color:var(--tx);background:var(--abg)}
.ft-feats{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.ft-feat{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:var(--rs);border:1.5px solid var(--bd2);font-size:13px;font-weight:500;cursor:pointer;transition:var(--tr)}.ft-feat:hover{border-color:var(--bd)}.ft-feat.sel{border-color:var(--tx);background:var(--abg)}
.ft-chk{width:20px;height:20px;border-radius:4px;border:1.5px solid var(--bd);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:10px;color:var(--sf)}.ft-feat.sel .ft-chk{background:var(--tx);border-color:var(--tx);color:#fff}
.ft-nav{display:flex;justify-content:space-between;padding:0 clamp(20px,3vw,32px) clamp(20px,3vw,32px)}
.bp-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bp-item{padding:10px;background:var(--alt);border-radius:var(--rs)}.bp-item label{display:block;font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}.bp-item span{font-size:13px;font-weight:600}

/* Forge animation */
.fao{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:24px;padding:20px}
.fao-title{font-family:var(--fd);font-size:clamp(20px,3vw,28px);color:#fff;font-weight:700}
.fao-bar{width:min(360px,80vw);height:6px;background:rgba(255,255,255,.15);border-radius:3px;overflow:hidden}
.fao-fill{height:100%;background:#fff;border-radius:3px;animation:forgeprog 3s ease forwards}
@keyframes forgeprog{from{width:0}to{width:100%}}
.fao-steps{color:rgba(255,255,255,.6);font-size:13px;display:flex;flex-direction:column;gap:6px}
.fao-steps div{opacity:0;animation:fu .4s ease forwards}

/* AI Section */
.aib{max-width:640px;margin:0 auto}

/* Pricing */
.px-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.px-c{padding:clamp(24px,3vw,32px);border-radius:var(--r);background:var(--sf);border:1.5px solid var(--bd2);position:relative;text-align:center;transition:var(--tr)}.px-c:hover{transform:translateY(-4px);box-shadow:var(--shl)}
.px-c.pop{border-color:var(--tx);box-shadow:var(--shl)}
.px-badge{position:absolute;top:-12px;left:50%;transform:translateX(-50%);padding:4px 16px;background:var(--tx);color:#fff;border-radius:var(--rp);font-size:11px;font-weight:700;white-space:nowrap}
.px-c h3{font-size:20px;font-weight:700;margin-bottom:6px}
.px-desc{font-size:14px;color:var(--t2);margin-bottom:20px}
.px-fl{list-style:none;margin-bottom:24px;text-align:left}
.px-fl li{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px;color:var(--t2)}.px-fl li svg{color:var(--gn);flex-shrink:0}

/* Contact */
.ctg{display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,4vw,48px);align-items:start}
.cti{display:flex;align-items:start;gap:12px;padding:12px 0}
.cto{width:40px;height:40px;border-radius:var(--rs);background:var(--abg);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--t2)}
.bf{margin-bottom:16px}.bf label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.bg2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:600px){.ctg{grid-template-columns:1fr}.bg2{grid-template-columns:1fr}}
.suc-card{padding:clamp(24px,4vw,40px);text-align:center;max-width:400px;margin:40px auto 0}

/* Footer */
.foot{background:var(--tx);color:rgba(255,255,255,.7);padding:clamp(40px,6vw,72px) clamp(20px,4vw,60px) 0}

function timeAgo(dateStr){if(!dateStr)return'';var diff=Date.now()-new Date(dateStr).getTime();var mins=Math.floor(diff/60000);if(mins<1)return'Just now';if(mins<60)return mins+'m ago';var hrs=Math.floor(mins/60);if(hrs<24)return hrs+'h ago';var days=Math.floor(hrs/24);if(days<7)return days+'d ago';return new Date(dateStr).toLocaleDateString('en-US',{month:'short',day:'numeric'});}
function formatDate(dateStr){if(!dateStr)return'';return new Date(dateStr).toLocaleDateString('en-US',{month:'short',day:'numeric'});}
function fileCategory(mime){if(!mime)return'file';if(mime.startsWith('image/'))return'image';if(mime==='application/pdf')return'pdf';if(mime.indexOf('zip')>=0||mime.indexOf('compressed')>=0)return'zip';return'file';}

var Auth={
  login:async function(email,password){
    if(!SUPABASE_READY)throw new Error('Server connection unavailable. Please refresh.');
    if(!email||!email.trim())throw new Error('Please enter your email');
    if(!password)throw new Error('Please enter your password');
    var result=await supabase.auth.signInWithPassword({email:email,password:password});
    if(result.error)throw new Error(result.error.message);
    S.user=result.data.user;
    try{S.profile=await loadProfile(S.user.id);}catch(e){}
    return S.user;
  },
  signup:async function(name,email,password){
    if(!SUPABASE_READY)throw new Error('Server connection unavailable. Please refresh.');
    if(!name||!name.trim())throw new Error('Please enter your name');
    if(!email||!email.trim())throw new Error('Please enter your email');
    if(!password||password.length<6)throw new Error('Password must be at least 6 characters');
    var result=await supabase.auth.signUp({email:email,password:password,options:{data:{name:name}}});
    if(result.error)throw new Error(result.error.message);
    S.user=result.data.user;
    if(result.data.session)S.user=result.data.session.user;
    if(S.user){
      await new Promise(function(r){setTimeout(r,800);});
      try{S.profile=await loadProfile(S.user.id);}catch(e){}
      if(!S.profile){try{await supabase.from('profiles').upsert({id:S.user.id,name:name,email:email,role:'client'},{onConflict:'id'});S.profile=await loadProfile(S.user.id);}catch(e){}}
    }
    return S.user;
  },
  logout:async function(){
    if(SUPABASE_READY)await supabase.auth.signOut();
    S.user=null;S.profile=null;
    DB={projects:[],messages:[],tasks:[],files:[],invoices:[],support:[],notifications:[],clients:[],requests:[],payments:[],allPayments:[],templates:DB.templates,allProjects:[],allInvoices:[]};
  },
  getSession:async function(){
    if(!SUPABASE_READY)return null;
    try{var result=await supabase.auth.getSession();if(result.data.session){S.user=result.data.session.user;try{S.profile=await loadProfile(S.user.id);}catch(e){}return S.user;}}catch(e){console.error('getSession error:',e);}
    return null;
  }
};

async function loadProfile(userId){if(!SUPABASE_READY)return null;var result=await supabase.from('profiles').select('*').eq('id',userId).single();return result.data;}

async function loadClientData(){
  if(!S.user||!SUPABASE_READY)return;
  try{
    S.profile=await loadProfile(S.user.id);
    var projResult=await supabase.from('projects').select('*').eq('client_id',S.user.id).order('created_at',{ascending:false});
    var projects=projResult.data||[];
    var projectIds=projects.map(function(p){return p.id;});
    DB.projects=projects.map(function(p){return{id:p.id,name:p.name,type:p.type||'',status:p.status,progress:p.progress||0,date:formatDate(p.created_at)};});
    if(projectIds.length>0){
      var msgResult=await supabase.from('messages').select('*, sender:profiles(name)').in('project_id',projectIds).order('created_at',{ascending:false}).limit(50);
      DB.messages=(msgResult.data||[]).map(function(m){return{id:m.id,from:(m.sender&&m.sender.name)?m.sender.name:'CyberForge',prev:m.content?m.content.substring(0,60):'',time:timeAgo(m.created_at),unread:!m.is_read};});
      var taskResult=await supabase.from('tasks').select('*').in('project_id',projectIds).order('created_at',{ascending:false});
      DB.tasks=(taskResult.data||[]).map(function(t){var proj=projects.find(function(p){return p.id===t.project_id;});return{id:t.id,title:t.title,proj:proj?proj.name:'',due:t.due_date?formatDate(t.due_date):'No date',done:t.status==='done'};});
      var fileResult=await supabase.from('files').select('*').in('project_id',projectIds).order('created_at',{ascending:false});
      DB.files=(fileResult.data||[]).map(function(f){return{id:f.id,name:f.original_name,type:fileCategory(f.mime_type),size:f.file_size?(f.file_size/1024/1024).toFixed(1)+' MB':'Unknown',date:formatDate(f.created_at)};});
      var invResult=await supabase.from('invoices').select('*').eq('client_id',S.user.id).order('created_at',{ascending:false});
      DB.invoices=(invResult.data||[]).map(function(inv){var proj=projects.find(function(p){return p.id===inv.project_id;});return{id:inv.id,number:inv.invoice_number,proj:proj?proj.name:'',amount:'$'+Number(inv.amount).toLocaleString(),status:inv.status,date:formatDate(inv.created_at)};});
      var tickResult=await supabase.from('support_tickets').select('*').eq('client_id',S.user.id).order('created_at',{ascending:false});
      DB.support=(tickResult.data||[]).map(function(t){return{id:t.id,subject:t.subject,status:t.status,date:formatDate(t.created_at)};});

async function loadAdminData(){
  if(!S.user||!SUPABASE_READY)return;
  try{
    var clientResult=await supabase.from('profiles').select('*').eq('role','client').order('created_at',{ascending:false});
    var clients=clientResult.data||[];
    DB.clients=[];
    for(var i=0;i<clients.length;i++){var c=clients[i];var countResult=await supabase.from('projects').select('id',{count:'exact',head:true}).eq('client_id',c.id);var firstProj=await supabase.from('projects').select('name').eq('client_id',c.id).limit(1).maybeSingle();DB.clients.push({id:c.id,name:c.name,email:c.email,biz:firstProj.data?firstProj.data.name:'',proj:countResult.count||0,status:'active'});}
    var allProjResult=await supabase.from('projects').select('*, client:profiles(name)').order('created_at',{ascending:false});
    DB.allProjects=(allProjResult.data||[]).map(function(p){return{id:p.id,client:p.client?p.client.name:'Unknown',name:p.name,type:p.type||'',status:p.status,progress:p.progress||0};});
    var allInvResult=await supabase.from('invoices').select('*, client:profiles(name)').order('created_at',{ascending:false});
    DB.allInvoices=(allInvResult.data||[]).map(function(inv){return{id:inv.id,number:inv.invoice_number,client:inv.client?inv.client.name:'Unknown',amount:'$'+Number(inv.amount).toLocaleString(),status:inv.status,date:formatDate(inv.created_at)};});
    var reqResult=await supabase.from('contact_submissions').select('*').order('created_at',{ascending:false}).limit(20);
    DB.requests=(reqResult.data||[]).map(function(r){return{id:r.id,client:r.name,biz:r.message.substring(0,30),type:'New Inquiry',date:timeAgo(r.created_at),status:r.status==='new'?'pending':r.status};});
    var allMsgResult=await supabase.from('messages').select('*, sender:profiles(name)').order('created_at',{ascending:false}).limit(50);
    DB.messages=(allMsgResult.data||[]).map(function(m){return{id:m.id,from:m.sender?m.sender.name:'Unknown',prev:m.content?m.content.substring(0,60):'',time:timeAgo(m.created_at),unread:!m.is_read};});
    var allFileResult=await supabase.from('files').select('*').order('created_at',{ascending:false}).limit(20);
    DB.files=(allFileResult.data||[]).map(function(f){return{id:f.id,name:f.original_name,type:fileCategory(f.mime_type),size:f.file_size?(f.file_size/1024/1024).toFixed(1)+' MB':'Unknown',date:formatDate(f.created_at)};});
    DB.notifications=[];
    var allNotifResult=await supabase.from('notifications').select('*').order('created_at',{ascending:false}).limit(20);
    DB.notifications=(allNotifResult.data||[]).map(function(n){return{id:n.id,text:n.text,time:timeAgo(n.created_at),unread:!n.is_read};});
    var allPayResult=await supabase.from('payments').select('*, client:profiles(name)').order('created_at',{ascending:false}).limit(50);
    DB.allPayments=(allPayResult.data||[]).map(function(p){return{id:p.id,client:p.client?p.client.name:'Unknown',amount:'$'+Number(p.amount).toLocaleString(),name:p.payer_name,email:p.payer_email,date:formatDate(p.created_at),status:p.status};});
  }catch(err){console.error('Error loading admin data:',err);}
}

else if(S.as==='requests'){h+='<div class="cd" style="overflow:auto"><table class="dtb"><thead><tr><th>Client</th><th>Business</th><th>Date</th><th>Status</th><th>Action</th></tr></thead><tbody>';if(DB.requests.length===0)h+='<tr><td colspan="5" style="text-align:center;color:var(--t3)">No requests yet.</td></tr>';DB.requests.forEach(function(r){h+='<tr><td>'+esc(r.client)+'</td><td>'+esc(r.biz)+'</td><td>'+r.date+'</td><td>'+statusBadge(r.status)+'</td><td>'+(r.status==='pending'?'<button class="btn bp bm" data-a="reqappr" data-v="'+r.id+'">Approve</button>':'-')+'</td></tr>';});h+='</tbody></table></div>';}
else if(S.as==='messages'){h+='<div class="cd" style="padding:8px">';if(DB.messages.length===0)h+='<p style="color:var(--t3);font-size:14px;padding:20px">No messages yet.</p>';DB.messages.forEach(function(m){h+='<div class="msg-item'+(m.unread?' unread':'')+'">'+(m.unread?'<div class="msg-dot"></div>':'<div style="width:8px"></div>')+'<div class="msg-av">'+m.from.charAt(0)+'</div><div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:700">'+esc(m.from)+'</div><div style="font-size:12px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(m.prev)+'</div></div><div style="font-size:11px;color:var(--t3)">'+m.time+'</div></div>';});h+='</div>';}
else if(S.as==='invoices'){h+='<div class="cd" style="overflow:auto"><table class="dtb"><thead><tr><th>Invoice</th><th>Client</th><th>Amount</th><th>Status</th></tr></thead><tbody>';if(DB.allInvoices.length===0)h+='<tr><td colspan="4" style="text-align:center;color:var(--t3)">No invoices yet.</td></tr>';DB.allInvoices.forEach(function(inv){h+='<tr><td>'+esc(inv.number)+'</td><td>'+esc(inv.client)+'</td><td style="font-weight:700">'+inv.amount+'</td><td>'+statusBadge(inv.status)+'</td></tr>';});h+='</tbody></table></div>';}
else if(S.as==='payments'){h+='<div class="section-hd"><h3>All Payments</h3></div><div class="cd" style="overflow:auto"><table class="dtb"><thead><tr><th>Date</th><th>Client</th><th>Amount</th><th>Payer</th><th>Status</th></tr></thead><tbody>';if(!DB.allPayments||DB.allPayments.length===0)h+='<tr><td colspan="5" style="text-align:center;color:var(--t3)">No payments yet.</td></tr>';(DB.allPayments||[]).forEach(function(p){h+='<tr><td>'+p.date+'</td><td>'+esc(p.client)+'</td><td style="font-weight:700">'+p.amount+'</td><td>'+esc(p.name||'-')+'</td><td>'+statusBadge(p.status)+'</td></tr>';});h+='</tbody></table></div>';}
else if(S.as==='files'){h+='<div class="cd" style="padding:16px">';if(DB.files.length===0)h+='<p style="color:var(--t3);font-size:14px;padding:20px">No files yet.</p>';DB.files.forEach(function(f){h+='<div class="file-item">'+fileIcoType(f.type)+'<div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:600">'+esc(f.name)+'</div><div style="font-size:11px;color:var(--t3)">'+f.size+' \u00b7 '+f.date+'</div></div></div>';});h+='</div>';}
else if(S.as==='templates'){h+='<div class="card-grid">';DB.templates.forEach(function(t){h+='<div class="tpl-card"><div class="tpl-top" style="background:var(--abg)"></div><h4>'+esc(t.name)+'</h4><p>'+esc(t.cat)+' \u00b7 '+t.uses+' uses</p></div>';});h+='</div>';}
else if(S.as==='analytics'){h+='<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px">';[{t:'Page Views',v:'12,847'},{t:'Conversions',v:'342'},{t:'Avg. Session',v:'3m 24s'},{t:'Bounce Rate',v:'38%'}].forEach(function(a){h+='<div class="an-card"><h4>'+a.t+'</h4><div class="an-val">'+a.v+'</div></div>';});h+='</div>';}
else if(S.as==='settings'){h+='<div class="cd" style="padding:clamp(20px,3vw,32px)"><h3 style="font-size:15px;font-weight:700;margin-bottom:20px">Business Settings</h3><div class="bg2">';[{l:'Business Name',f:'setName',v:C.name},{l:'Email',f:'setEm',v:C.em},{l:'Phone',f:'setPh',v:C.ph},{l:'Hours',f:'setHrs',v:C.hrs}].forEach(function(x){h+='<div class="bf"><label>'+x.l+'</label><input class="in" data-f="'+x.f+'" value="'+esc(x.v)+'"></div>';});h+='</div><div style="margin-top:20px"><button class="btn bp" data-a="saveset">'+ic('check',14)+' Save Settings</button></div></div>';}
h+='</main></div>';return h;}

// Auth
function rAuth(){var isL=S.pg==='login',isF=S.pg==='forgot';var h='<div class="apg"><div class="acd"><div style="text-align:center;margin-bottom:24px">'+lg(40)+'</div>';h+='<h2 style="text-align:center">'+(isL?'Welcome Back':isF?'Reset Password':'Create Account')+'</h2>';h+='<p style="text-align:center;color:var(--t2);font-size:14px;margin-bottom:24px">'+(isL?'Sign in to your account':isF?'Enter your email':'Join CyberForge')+'</p>';if(S.aErr)h+='<div class="aer">'+esc(S.aErr)+'</div>';h+='<form data-form="auth">';if(!isL&&!isF)h+='<div class="bf"><label>Full Name</label><input class="in" data-f="an" value="'+esc(S.an)+'" placeholder="Your name"></div>';h+='<div class="bf"><label>Email</label><input class="in" type="email" data-f="ae" value="'+esc(S.ae)+'" placeholder="you@example.com"></div>';if(!isF)h+='<div class="bf"><label>Password</label><input class="in" type="password" data-f="ap" value="'+esc(S.ap)+'" placeholder="Enter password"></div>';if(isL)h+='<div style="text-align:right;margin-bottom:12px"><a href="javascript:void(0)" data-a="pg" data-v="forgot" style="font-size:13px">Forgot password?</a></div>';h+='<button type="submit" class="btn bp'+(S.authLoading?' bd':'')+'" style="width:100%;justify-content:center"'+(S.authLoading?' disabled':'')+'>'+(isL?(S.authLoading?'Signing in...':'Sign In'):isF?(S.authLoading?'Sending...':'Send Reset Link'):(S.authLoading?'Creating...':'Create Account'))+'</button></form>';h+='<div style="text-align:center;margin-top:20px;font-size:13px">';if(isL)h+='<a href="javascript:void(0)" data-a="pg" data-v="signup">Don\'t have an account? Sign up</a>';else if(isF)h+='<a href="javascript:void(0)" data-a="pg" data-v="login">Back to Sign In</a>';else h+='<a href="javascript:void(0)" data-a="pg" data-v="login">Already have an account? Sign in</a>';h+='</div></div></div>';return h;}

function rLightbox(){if(!S.lb)return'';return '<div class="lb" data-a="lbclose"><div class="lb-img" onclick="event.stopPropagation()">'+imgPh(S.lb.label||'',S.lb.type||'hero','16/9')+'</div><button class="lb-close" data-a="lbclose" aria-label="Close">'+ic('x',20)+'</button>'+(S.lb.caption?'<div class="lb-caption">'+esc(S.lb.caption)+'</div>':'')+'</div>';}

// ============================================================
// MAIN RENDER
// ============================================================
function render(){var p=S.pg,h='';if(p==='home')h=rNav()+rHero()+rTrust()+rServices()+rPortfolio()+rProcess()+rForge()+rAI()+rPricing()+rCTA()+rContact()+rFoot();else if(p==='builder'){if(!S.user){S.pg='login';S.returnTo='builder';render();return;}h=rNav()+rBuilder()+rFoot();}else if(p==='dashboard'){if(!S.user){S.pg='login';render();return;}h=rDash();}else if(p==='admin'){if(!S.user){S.pg='login';render();return;}if(S.profile&&S.profile.role!=='admin'){toast('Admin access required','error');S.pg='dashboard';render();return;}h=rAdmin();}else if(p==='login'||p==='signup'||p==='forgot')h=rAuth();h+=rPreview()+rLightbox();if(S.forging)h+=rForgeAnim();document.getElementById('app').innerHTML=h;reveal();var nav=document.getElementById('nav');if(nav)nav.classList.toggle('sc',window.scrollY>20);}

async function nav(p){S.pg=p;S.mm=false;S.dso=false;S.aso=false;S.pfS=null;S.lb=null;render();window.scrollTo(0,0);if(p==='dashboard'&&S.user&&SUPABASE_READY){await loadClientData();render();}if(p==='admin'&&S.user&&SUPABASE_READY){await loadAdminData();render();}}
function afterAuth(){if(S.returnTo==='builder'||S.returnTo==='forge'){S.returnTo=null;nav('builder');}else if(S.returnTo){var rt=S.returnTo;S.returnTo=null;nav(rt);}else{nav('dashboard');}}

function scroll2(id){S.mm=false;render();setTimeout(function(){var el=document.getElementById(id);if(el)el.scrollIntoView({behavior:'smooth'});},50);}
function reveal(){if(window.matchMedia('(prefers-reduced-motion:reduce)').matches){document.querySelectorAll('.rev').forEach(function(e){e.classList.add('v');});return;}var obs=new IntersectionObserver(function(en){en.forEach(function(e){if(e.isIntersecting){e.target.classList.add('v');obs.unobserve(e.target);}});},{threshold:.08});document.querySelectorAll('.rev:not(.v)').forEach(function(e){obs.observe(e);});}

// ============================================================
// EVENT HANDLING
// ============================================================
document.addEventListener('click',async function(e){var t=e.target.closest('[data-a]');if(!t)return;var a=t.dataset.a,v=t.dataset.v;try{switch(a){
case'pg':nav(v);break;
case'gobuilder':S.returnTo='builder';if(S.user){nav('builder');}else{nav('login');toast('Sign in to start your project','info');}break;
case'goforge2builder':S.bf.tp=S.fb;S.bf.st=S.fsl;S.bf.ft=S.fft.slice();if(S.user){S.pg='builder';S.bDone=false;S.bs=0;S.bErr={};render();window.scrollTo(0,0);}else{S.returnTo='builder';nav('login');toast('Sign in to continue','info');}break;
case'gopfbuild':var pf2=PFO[parseInt(v)];S.pfS=null;S.bf.tp=pf2.tp;S.bs=0;S.bDone=false;S.bErr={};if(S.user){S.pg='builder';render();window.scrollTo(0,0);toast('Pre-filled with '+pf2.tp,'info');}else{S.returnTo='builder';nav('login');toast('Sign in to start building','info');}break;
case'scroll':scroll2(v);break;case'mm':S.mm=!S.mm;render();break;
case'fbiz':S.fb=v;S.fs=1;render();break;case'fsty':S.fsl=v;S.fs=2;render();break;
case'ffea':var i=S.fft.indexOf(v);if(i>=0)S.fft.splice(i,1);else S.fft.push(v);render();break;
case'fstep':var sv=parseInt(v);if(sv<=S.fs)S.fs=sv;render();break;
case'fnext':if(S.fs===0&&!S.fb){toast('Please select a business type','error');break;}if(S.fs===1&&!S.fsl){toast('Please select a style','error');break;}S.fs++;render();break;
case'fprev':S.fs--;render();break;
case'forge':S.forging=true;render();setTimeout(function(){S.forging=false;S.forged=true;render();toast('Blueprint complete!','success');},3500);break;
case'resetforge':S.forged=false;S.fs=0;S.fb='';S.fsl='';S.fft=[];render();break;
case'aigen':if(!S.ai.trim()||S.aiL)break;S.aiL=true;S.aiR=null;render();setTimeout(function(){var l=S.ai.toLowerCase();var isR=l.indexOf('restaurant')>=0||l.indexOf('food')>=0||l.indexOf('cafe')>=0;var isB=l.indexOf('barber')>=0||l.indexOf('salon')>=0||l.indexOf('hair')>=0;var isG=l.indexOf('gym')>=0||l.indexOf('fitness')>=0;var isRE=l.indexOf('real estate')>=0||l.indexOf('property')>=0;S.aiR={biz:isR?'Ember Kitchen':isB?'The Fade Room':isG?'Iron Forge Gym':isRE?'Urban Nest':'Your Business',type:isR?'Restaurant':isB?'Barber Shop':isG?'Gym':isRE?'Real Estate':'Business',tagline:isR?'Fine Dining Experience':isB?'Classic Cuts, Modern Style':isG?'Forge Your Best Self':isRE?'Find Your Dream Home':'Your Tagline',cta:isR?'Reserve a Table':isB?'Book Now':isG?'Join Now':isRE?'Browse Properties':'Get Started',audience:isR?'Local diners seeking quality dining':isB?'People looking for premium grooming':'People searching for services locally',design:isR?'Warm, inviting with rich food imagery.':isB?'Clean, modern with bold imagery.':'Professional with strong visuals.'};S.aiL=false;render();toast('Concept generated!','success');},1500);break;
case'pff':S.pfF=v;S.pfS=null;render();break;
case'pfs':S.pfS=parseInt(v);S.pvDev='desktop';render();break;
case'pvc':S.pfS=null;render();break;
case'pvd':S.pvDev=v;render();break;
case'bstep':var bsv=parseInt(v);if(bsv<=S.bs)S.bs=bsv;S.bErr={};render();break;
case'bnext':var errs=validateBStep(S.bs);S.bErr=errs;if(Object.keys(errs).length){render();toast(errs[Object.keys(errs)[0]],'error');break;}S.bs++;S.bErr={};render();break;
case'bprev':S.bs--;S.bErr={};render();break;
case'bsub':var fe=validateBStep(3);S.bErr=fe;if(Object.keys(fe).length){S.bs=3;render();toast(fe[Object.keys(fe)[0]],'error');break;}if(S.user&&SUPABASE_READY){try{await dbCreateProject(S.bf);S.bDone=true;render();toast('Project submitted!','success');}catch(er){toast('Error: '+er.message,'error');}}else{S.bDone=true;render();toast('Project submitted!','success');}break;
case'breset':S.bDone=false;S.bs=0;S.bf={nm:'',bz:'',tp:'',st:'',cl:'',insp:'',ft:[],em:'',ph:'',wa:''};S.bErr={};render();break;
case'bfea':var fi=S.bf.ft.indexOf(v);if(fi>=0)S.bf.ft.splice(fi,1);else S.bf.ft.push(v);render();break;
case'cfreset':S.cfOk=false;S.cfNm='';S.cfEm='';S.cfMs='';S.cfErrs={};render();break;
case'dsnav':S.ds=v;render();break;case'dsmm':S.dso=!S.dso;render();break;
case'tasktoggle':var tid=parseInt(v);var task=DB.tasks.find(function(t){return t.id===tid;});if(task){task.done=!task.done;render();await dbToggleTask(tid,!task.done);toast(task.done?'Task completed':'Task reopened','success');}break;
case'filedl':toast('Download started','info');break;
case'newticket':toast('Support ticket form coming soon','info');break;
case'notifread':var nid=parseInt(v);var n=DB.notifications.find(function(x){return x.id===nid;});if(n){n.unread=false;render();await dbMarkNotificationRead(nid);}break;
case'notifclear':DB.notifications.forEach(function(n){n.unread=false;});render();await dbMarkAllNotificationsRead();toast('All cleared','success');break;
case'asnav':S.as=v;render();break;case'asmm':S.aso=!S.aso;render();break;
case'reqappr':var rid=parseInt(v);var req=DB.requests.find(function(r){return r.id===rid;});if(req){req.status='approved';render();await dbApproveRequest(rid);toast('Request approved','success');}break;
case'saveset':document.querySelectorAll('[data-f^="set"]').forEach(function(el){var f=el.dataset.f,val=el.value;if(f==='setName')C.name=val;if(f==='setEm')C.em=val;if(f==='setPh')C.ph=val;if(f==='setHrs')C.hrs=val;});render();toast('Settings saved','success');break;
case'logout':await Auth.logout();nav('home');toast('Signed out','info');break;
case'lbclose':S.lb=null;render();break;
}}catch(err){console.error('Click handler error:',err);}});

document.addEventListener('submit',async function(e){e.preventDefault();try{if(e.target.dataset.form==='contact'){var errs=validateContact();S.cfErrs=errs;if(Object.keys(errs).length){render();return;}S.cfLd=true;render();try{await dbSubmitContact(S.cfNm,S.cfEm,S.cfMs);S.cfLd=false;S.cfOk=true;render();toast('Message sent!','success');}catch(er){S.cfLd=false;render();toast('Failed to send: '+er.message,'error');}}
if(e.target.dataset.form==='auth'){S.aErr='';S.authLoading=true;render();try{if(S.pg==='forgot'){if(!SUPABASE_READY)throw new Error('Server unavailable');var result=await supabase.auth.resetPasswordForEmail(S.ae,{redirectTo:window.location.origin+window.location.pathname});if(result.error)throw new Error(result.error.message);S.authLoading=false;render();toast('Reset link sent! Check your email.','success');nav('login');}else if(S.pg==='signup'){await Auth.signup(S.an,S.ae,S.ap);S.authLoading=false;await loadClientData();render();toast('Welcome to CyberForge!','success');afterAuth();}else{await Auth.login(S.ae,S.ap);S.authLoading=false;await loadClientData();render();toast('Welcome back!','success');afterAuth();}}catch(er){S.aErr=er.message;S.authLoading=false;render();}}}catch(err){console.error('Submit handler error:',err);}});

document.addEventListener('input',function(e){var f=e.target.dataset.f;if(!f)return;var v=e.target.value;switch(f){case'ai':S.ai=v;break;case'bn':S.bf.nm=v;break;case'bb':S.bf.bz=v;break;case'bt':S.bf.tp=v;break;case'bst':S.bf.st=v;break;case'bc':S.bf.cl=v;break;case'bi':S.bf.insp=v;break;case'be':S.bf.em=v;break;case'bp':S.bf.ph=v;break;case'bw':S.bf.wa=v;break;case'ae':S.ae=v;break;case'ap':S.ap=v;break;case'an':S.an=v;break;case'cfNm':S.cfNm=v;break;case'cfEm':S.cfEm=v;break;case'cfMs':S.cfMs=v;break;}});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){if(S.pfS!==null){S.pfS=null;render();}if(S.lb){S.lb=null;render();}if(S.mm){S.mm=false;render();}}});
window.addEventListener('scroll',function(){var n=document.getElementById('nav');if(n)n.classList.toggle('sc',window.scrollY>20);},{passive:true});

// ============================================================
// PAGE LOAD — GUARANTEED FAST
// ============================================================
(function(){
  hideLoader();
  render();
  if(SUPABASE_READY){
    Auth.getSession().then(function(user){
      if(user){return loadClientData().then(function(){render();});}
    }).catch(function(e){console.error('Session check failed:',e);});
  }
  setTimeout(hideLoader, 1000);
})();
</script>
