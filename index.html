    if(!email||!email.trim())throw new Error('Please enter your email');
    if(!password||password.length<6)throw new Error('Password must be at least 6 characters');

    if(r.error)throw new Error(r.error.message);

    if(S.user){
      await new Promise(function(r){setTimeout(r,800);});

async function loadAdminData(){

    var rq=await supabase.from('contact_submissions').select('*').order('created_at',{ascending:false}).limit(20);

    var am=await supabase.from('messages').select('*,sender:profiles(name)').order('created_at',{ascending:false}).limit(50);
    DB.messages=(am.data||[]).map(function(m){return{id:m.id,from:m.sender?m.sender.name:'Unknown',prev:m.content?m.content.substring(0,60):'',time:timeAgo(m.created_at),unread:!m.is_read};});
    var af=await supabase.from('files').select('*').order('created_at',{ascending:false}).limit(20);
    DB.files=(af.data||[]).map(function(f){return{id:f.id,name:f.original_name,type:fileCategory(f.mime_type),size:f.file_size?(f.file_size/1024/1024).toFixed(1)+' MB':'-',date:formatDate(f.created_at)};});
    var an=await supabase.from('notifications').select('*').order('created_at',{ascending:false}).limit(20);
    DB.notifications=(an.data||[]).map(function(n){return{id:n.id,text:n.text,time:timeAgo(n.created_at),unread:!n.is_read};});
    var apy=await supabase.from('payments').select('*,client:profiles(name)').order('created_at',{ascending:false}).limit(50);
    DB.allPayments=(apy.data||[]).map(function(p){return{id:p.id,client:p.client?p.client.name:'Unknown',amount:'$'+Number(p.amount).toLocaleString(),name:p.payer_name,email:p.payer_email,date:formatDate(p.created_at),status:p.status};});
  }catch(err){console.error('loadAdminData error:',err);}
}

function rAuth(){var isL=S.pg==='login',isF=S.pg==='forgot';var h='<div class="apg"><div class="acd"><div style="text-align:center;margin-bottom:24px">'+lg(40)+'</div><h2 style="text-align:center">'+(isL?'Welcome Back':isF?'Reset Password':'Create Account')+'</h2><p style="text-align:center;color:var(--t2);font-size:14px;margin-bottom:24px">'+(isL?'Sign in to your account':isF?'Enter your email':'Join CyberForge')+'</p>';if(S.aErr)h+='<div class="aer">'+esc(S.aErr)+'</div>';h+='<form data-form="auth">';if(!isL&&!isF)h+='<div class="bf"><label>Full Name</label><input class="in" data-f="an" value="'+esc(S.an)+'" placeholder="Your name"></div>';h+='<div class="bf"><label>Email</label><input class="in" type="email" data-f="ae" value="'+esc(S.ae)+'" placeholder="you@example.com"></div>';if(!isF)h+='<div class="bf"><label>Password</label><input class="in" type="password" data-f="ap" value="'+esc(S.ap)+'" placeholder="Enter password"></div>';if(isL)h+='<div style="text-align:right;margin-bottom:12px"><a href="javascript:void(0)" data-a="pg" data-v="forgot" style="font-size:13px">Forgot password?</a></div>';h+='<button type="submit" class="btn bp'+(S.authLoading?' bd':'')+'" style="width:100%;justify-content:center"'+(S.authLoading?' disabled':'')+'>'+(isL?(S.authLoading?'Signing in...':'Sign In'):isF?(S.authLoading?'Sending...':'Send Reset Link'):(S.authLoading?'Creating...':'Create Account'))+'</button></form><div style="text-align:center;margin-top:20px;font-size:13px">';if(isL)h+='<a href="javascript:void(0)" data-a="pg" data-v="signup">Don\'t have an account? Sign up</a>';else if(isF)h+='<a href="javascript:void(0)" data-a="pg" data-v="login">Back to Sign In</a>';else h+='<a href="javascript:void(0)" data-a="pg" data-v="login">Already have an account? Sign in</a>';h+='</div></div></div>';return h;}

function render(){var p=S.pg,h='';if(p==='home')h=rNav()+rHero()+rTrust()+rServices()+rPortfolio()+rProcess()+rForge()+rAI()+rPricing()+rCTA()+rContact()+rFoot();else if(p==='builder'){if(!S.user){S.pg='login';S.returnTo='builder';render();return;}h=rNav()+rBuilder()+rFoot();}else if(p==='dashboard'){if(!S.user){S.pg='login';render();return;}h=rDash();}else if(p==='admin'){if(!S.user){S.pg='login';render();return;}if(S.profile&&S.profile.role!=='admin'){toast('Admin access required','error');S.pg='dashboard';render();return;}h=rAdmin();}else if(p==='login'||p==='signup'||p==='forgot')h=rAuth();h+=rPreview();if(S.forging)h+=rForgeAnim();document.getElementById('app').innerHTML=h;reveal();var nav=document.getElementById('nav');if(nav)nav.classList.toggle('sc',window.scrollY>20);}

async function nav(p){S.pg=p;S.mm=false;S.dso=false;S.aso=false;S.pfS=null;render();window.scrollTo(0,0);if(p==='dashboard'&&S.user&&SUPABASE_READY){await loadClientData();render();}if(p==='admin'&&S.user&&SUPABASE_READY){await loadAdminData();render();}hideLoader();}

function reveal(){var els=document.querySelectorAll('.rev');if(!els.length)return;if(!('IntersectionObserver' in window)){els.forEach(function(el){el.classList.add('v');});return;}var obs=new IntersectionObserver(function(entries){entries.forEach(function(e){if(e.isIntersecting){e.target.classList.add('v');obs.unobserve(e.target);}});},{threshold:0.1,rootMargin:'0px 0px -40px 0px'});els.forEach(function(el){obs.observe(el);});}

document.addEventListener('click',async function(e){
  var el=e.target.closest('[data-a]');
  if(!el)return;
  var a=el.dataset.a,v=el.dataset.v;
  if(a==='scroll'){var t=document.getElementById(v);if(t)t.scrollIntoView({behavior:'smooth'});}
  else if(a==='pg'){await nav(v);}
  else if(a==='mm'){S.mm=!S.mm;render();}
  else if(a==='gobuilder'){if(S.user)await nav('builder');else{S.pg='login';S.returnTo='builder';render();}}
  else if(a==='pff'){S.pfF=v;render();}
  else if(a==='pfs'){S.pfS=parseInt(v);render();}
  else if(a==='pvc'){S.pfS=null;render();}
  else if(a==='pvd'){S.pvDev=v;render();}
  else if(a==='fstep'){S.fs=parseInt(v);render();}
  else if(a==='fbiz'){S.fb=v;render();}
  else if(a==='fsty'){S.fsl=v;render();}
  else if(a==='ffea'){var idx=S.fft.indexOf(v);if(idx>=0)S.fft.splice(idx,1);else S.fft.push(v);render();}
  else if(a==='fprev'){if(S.fs>0)S.fs--;render();}
  else if(a==='fnext'){if(S.fs===0&&!S.fb)return;if(S.fs<3)S.fs++;render();}
  else if(a==='forge'){S.forging=true;render();setTimeout(function(){S.forging=false;S.forged=true;render();},3000);}
  else if(a==='resetforge'){S.forged=false;S.fs=0;S.fb='';S.fsl='';S.fft=[];render();}
  else if(a==='goforge2builder'){if(S.user){S.bf.bz=S.fb||'';S.bf.st=S.fsl||'';S.bf.ft=S.fft.slice();S.bs=0;await nav('builder');}else{S.pg='login';S.returnTo='builder';render();}}
  else if(a==='gopfbuild'){var it=PFO[parseInt(v)];if(it){if(S.user){S.bf.bz=it.t;S.bf.tp=it.tp;S.bs=0;await nav('builder');}else{S.pg='login';S.returnTo='builder';render();}}}
  else if(a==='aigen'){if(!S.ai.trim()||S.aiL)return;S.aiL=true;render();setTimeout(function(){var lower=S.ai.toLowerCase();var type='Business';if(lower.indexOf('restaurant')>=0||lower.indexOf('food')>=0)type='Restaurant';else if(lower.indexOf('barber')>=0||lower.indexOf('hair')>=0)type='Barber Shop';else if(lower.indexOf('car')>=0||lower.indexOf('auto')>=0)type='Car Dealership';else if(lower.indexOf('real estate')>=0||lower.indexOf('property')>=0||lower.indexOf('house')>=0)type='Real Estate';else if(lower.indexOf('cloth')>=0||lower.indexOf('fashion')>=0)type='Clothing Store';else if(lower.indexOf('gym')>=0||lower.indexOf('fitness')>=0)type='Gym';else if(lower.indexOf('photo')>=0||lower.indexOf('portfolio')>=0)type='Portfolio';else if(lower.indexOf('tech')>=0||lower.indexOf('software')>=0||lower.indexOf('startup')>=0)type='Tech Startup';var words=S.ai.split(/\s+/).filter(function(w){return w.length>2;}).slice(0,3);var biz=words.length?words.map(function(w){return w.charAt(0).toUpperCase()+w.slice(1).toLowerCase();}).join(' '):'My Business';S.aiR={biz:biz,type:type,tagline:'Welcome to '+biz,cta:'Get Started'};S.aiL=false;render();},1500);}
  else if(a==='bstep'){var s=parseInt(v);if(s<S.bs)S.bs=s;render();}
  else if(a==='bprev'){if(S.bs>0)S.bs--;render();}
  else if(a==='bnext'){var errs=validateBStep(S.bs);if(Object.keys(errs).length){S.bErr=errs;render();return;}S.bErr={};if(S.bs<4)S.bs++;render();}
  else if(a==='bsub'){var allErrs=validateBStep(3);if(Object.keys(allErrs).length){S.bErr=allErrs;S.bs=3;render();return;}S.bErr={};try{if(SUPABASE_READY)await dbCreateProject(S.bf);S.bDone=true;toast('Project submitted!','success');render();}catch(err){toast(err.message,'error');}}
  else if(a==='breset'){S.bDone=false;S.bs=0;S.bf={nm:'',bz:'',tp:'',st:'',cl:'',insp:'',ft:[],em:'',ph:'',wa:''};S.bErr={};render();}
  else if(a==='bfea'){var idx2=S.bf.ft.indexOf(v);if(idx2>=0)S.bf.ft.splice(idx2,1);else S.bf.ft.push(v);render();}
  else if(a==='logout'){await Auth.logout();await nav('home');toast('Signed out','info');}
  else if(a==='dsnav'){S.ds=v;S.dso=false;render();}
  else if(a==='dsmm'){S.dso=!S.dso;render();}
  else if(a==='asnav'){S.as=v;S.aso=false;render();}
  else if(a==='asmm'){S.aso=!S.aso;render();}
  else if(a==='tasktoggle'){var t=DB.tasks.find(function(x){return x.id===v;});if(t){t.done=!t.done;render();await dbToggleTask(t.id,t.done);}}
  else if(a==='saveset'){toast('Settings saved','success');}
  else if(a==='cfreset'){S.cfOk=false;S.cfNm='';S.cfEm='';S.cfMs='';S.cfErrs={};render();}
});

document.addEventListener('submit',async function(e){
  var form=e.target.closest('[data-form]');
  if(!form)return;
  e.preventDefault();
  if(form.dataset.form==='contact'){
    var errs=validateContact();
    if(Object.keys(errs).length){S.cfErrs=errs;render();return;}
    S.cfErrs={};S.cfLd=true;render();
    try{await dbSubmitContact(S.cfNm,S.cfEm,S.cfMs);S.cfLd=false;S.cfOk=true;toast('Message sent!','success');render();}catch(err){S.cfLd=false;toast(err.message,'error');render();}
  }else if(form.dataset.form==='auth'){
    S.authLoading=true;S.aErr='';render();
    try{
      if(S.pg==='login'){await Auth.login(S.ae,S.ap);toast('Welcome back!','success');if(S.profile&&S.profile.role==='admin')await nav('admin');else if(S.returnTo){var rt=S.returnTo;S.returnTo=null;await nav(rt);}else await nav('dashboard');}
      else if(S.pg==='signup'){await Auth.signup(S.an,S.ae,S.ap);toast('Account created!','success');await nav('dashboard');}
      else if(S.pg==='forgot'){S.aErr='Password reset is not yet configured.';S.authLoading=false;render();return;}
      S.authLoading=false;render();
    }catch(err){S.authLoading=false;S.aErr=err.message;render();}
  }
});

document.addEventListener('input',function(e){
  var el=e.target.closest('[data-f]');
  if(!el)return;
  var f=el.dataset.f,v=el.value;
  if(f==='cfNm')S.cfNm=v;else if(f==='cfEm')S.cfEm=v;else if(f==='cfMs')S.cfMs=v;
  else if(f==='an')S.an=v;else if(f==='ae')S.ae=v;else if(f==='ap')S.ap=v;
  else if(f==='bn')S.bf.nm=v;else if(f==='bb')S.bf.bz=v;
  else if(f==='be')S.bf.em=v;else if(f==='bp')S.bf.ph=v;else if(f==='bw')S.bf.wa=v;
  else if(f==='bc')S.bf.cl=v;else if(f==='bi')S.bf.insp=v;
  else if(f==='ai')S.ai=v;
});

document.addEventListener('change',function(e){
  var el=e.target;
  if(!el.classList.contains('sel'))return;
  var f=el.dataset.f,v=el.value;
  if(f==='bt')S.bf.tp=v;else if(f==='bst')S.bf.st=v;
});

window.addEventListener('scroll',function(){var n=document.getElementById('nav');if(n)n.classList.toggle('sc',window.scrollY>20);});

document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){
    if(S.pfS!==null){S.pfS=null;render();}
    if(S.mm){S.mm=false;render();}
  }
});

(async function(){
  await Auth.getSession();
  render();
  hideLoader();
})();
</script>
</body>
  </html>
